<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1130" viewBox="0 0 1200 1130" role="img" aria-labelledby="title desc">
<title id="title">팀원 모델의 입력과 출력 및 담당 범위</title>
<desc id="desc">공통 입력에서 세 팀원의 LSTM, Transformer, 풀이 간격을 추가한 LSTM으로 갈라집니다. 같은 형식의 예측 결과를 WaterMinCho가 같은 조건에서 비교하고 이후 후보별 예측과 앱 추천에 연결합니다. 모델과 앱 연결은 예정입니다.</desc>
<rect width="1200" height="1130" fill="#fff"/>
<text x="48" y="49" font-family="NanumGothic, sans-serif" font-size="34" font-weight="700" fill="#18263d">내 모델은 전체 구조의 어디에 들어가나요?</text>
<text x="48" y="87" font-family="NanumGothic, sans-serif" font-size="22" font-weight="400" fill="#516176">세 모델은 각자의 실습 환경에서 만듭니다. 프로그램·서버·공통 자료는 WaterMinCho가 맡습니다.</text>
<rect x="48" y="125" width="1104" height="154" rx="20" fill="#f5fbf8" stroke="#b8c6d7" stroke-width="2" />
<text x="76" y="166" font-family="NanumGothic, sans-serif" font-size="27" font-weight="700" fill="#17694e">공통 입력 준비 · 구현됨</text>
<text x="76" y="206" font-family="NanumGothic, sans-serif" font-size="25" font-weight="700" fill="#18263d">이전 풀이 이력 + 이번 문제·개념 정보</text>
<text x="76" y="246" font-family="NanumGothic, sans-serif" font-size="21" font-weight="400" fill="#516176">learning_server/input_example.py · 이번 정답은 inputs와 분리한 targets에 둡니다.</text>
