<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1548" viewBox="0 0 1200 1548" role="img" aria-labelledby="title desc">
<title id="title">풀이 기록에서 모델 학습과 문제 추천까지</title>
<desc id="desc">위에서 아래로 읽습니다. 현재는 수강생의 파이썬·AI 풀이 기록을 동의 후 비공개 서버에 모으고 WaterMinCho가 공통 자료를 준비합니다. 앞으로 세 팀원이 같은 자료로 각자 모델을 학습하고 코드·테스트·설명을 fork에서 PR로 보냅니다. WaterMinCho가 같은 조건에서 비교한 뒤 후보별 정답 확률과 복습 시점·선수 개념·목표를 사용해 다음 문제를 고르는 기능을 연결할 계획입니다.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#527b6d" stroke-width="2"/></marker>
  <marker id="planned" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#3658b9" stroke-width="2"/></marker>
  <style>
    text { font-family: NanumGothic, sans-serif; fill: #18263d; }
    .title { font-size: 29px; font-weight: 700; }
    .body { font-size: 23px; }
    .note { font-size: 20px; fill: #516176; }
    .name { font-size: 22px; font-weight: 700; fill: #3658b9; }
    .step { font-size: 22px; font-weight: 700; fill: white; text-anchor: middle; }
    .status { font-size: 17px; font-weight: 700; text-anchor: middle; }
  </style>
</defs>
<rect width="1200" height="1548" fill="#fff"/>
<text x="48" y="54" font-size="34" font-weight="700">푼 기록이 다음 문제 추천으로 이어지는 과정</text>
<text x="48" y="96" class="body">수강생의 기록을 모으고, 세 팀원이 같은 자료로 모델을 만들어 비교합니다.</text>

<rect x="48" y="140" width="1104" height="174" rx="20" fill="#f4faf7" stroke="#9ebfb0" stroke-width="2"/>
<circle cx="88" cy="182" r="21" fill="#17694e"/>
<text x="88" y="190" class="step">1</text>
<text x="124" y="191" class="title">수강생이 문제를 풉니다</text>
<text x="78" y="241" class="body">PC 프로그램에서 풀이·채점</text>
<text x="78" y="279" class="note">파이썬 · AI 개론·응용</text>
<rect x="650" y="162" width="474" height="128" rx="14" fill="#fff" stroke="#c8ded3"/>
<text x="672" y="198" class="note">설명용 예시</text>
<text x="672" y="238" font-size="25" font-weight="700">range 문제 · 오답</text>
<text x="672" y="271" class="note">기기에 답안·채점 결과·진도 저장</text>
<path d="M600 327 V352" fill="none" stroke="#527b6d" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="48" y="368" width="1104" height="272" rx="20" fill="#f4faf7" stroke="#9ebfb0" stroke-width="2"/>
<circle cx="88" cy="408" r="21" fill="#17694e"/>
<text x="88" y="416" class="step">2</text>
<text x="124" y="417" class="title">기록을 모아 공통 자료를 만듭니다</text>
<rect x="986" y="390" width="138" height="34" rx="17" fill="#ddefe5"/>
<text x="1055" y="413" class="status" style="fill:#17694e">현재 기능</text>
<rect x="78" y="450" width="474" height="134" rx="14" fill="#fff" stroke="#c8ded3"/>
<text x="100" y="487" font-size="24" font-weight="700">비공개 서버에 저장</text>
<text x="100" y="524" class="note">동의 후 새 정오답·확인된 시각 전송</text>
<text x="100" y="560" class="note">학습용 기록에는 답안 본문 제외</text>
<path d="M566 518 H631" fill="none" stroke="#527b6d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="650" y="450" width="474" height="134" rx="14" fill="#fff" stroke="#c8ded3"/>
<text x="672" y="487" font-size="24" font-weight="700">동일한 학습·검증·평가 자료</text>
<text x="672" y="524" class="note">WaterMinCho가 준비해 비공개 전달</text>
<text x="672" y="560" class="note">기존 동의 기록도 변환해 포함</text>
<text x="78" y="617" class="body">세 팀원은 같은 파일로 시작합니다.</text>
<path d="M600 654 V679" fill="none" stroke="#3658b9" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#planned)"/>

<rect x="48" y="698" width="1104" height="316" rx="20" fill="#f4f6fe" stroke="#6d83c2" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="88" cy="738" r="21" fill="#3658b9"/>
<text x="88" y="746" class="step">3</text>
<text x="124" y="747" class="title">팀원이 각자 모델을 학습합니다</text>
<rect x="986" y="720" width="138" height="34" rx="17" fill="#e5ebff"/>
<text x="1055" y="743" class="status" style="fill:#3658b9">모델 개발 예정</text>
<rect x="78" y="780" width="330" height="144" rx="14" fill="#fff" stroke="#cad4ed"/>
<text x="100" y="817" class="name">michae18</text>
<text x="100" y="859" font-size="27" font-weight="700">LSTM</text>
<text x="100" y="898" class="note">풀이 순서를 학습</text>
<rect x="435" y="780" width="330" height="144" rx="14" fill="#fff" stroke="#cad4ed"/>
<text x="457" y="817" class="name">wamangdoo</text>
<text x="457" y="859" font-size="27" font-weight="700">Transformer</text>
<text x="457" y="898" class="note">과거 풀이 기록의 관계를 학습</text>
<rect x="792" y="780" width="330" height="144" rx="14" fill="#fff" stroke="#cad4ed"/>
<text x="814" y="817" class="name">kimjs85529-a11y</text>
<text x="814" y="859" font-size="26" font-weight="700">LSTM + 풀이 간격</text>
<text x="814" y="898" class="note">같은 LSTM에 풀이 간격 추가</text>
<text x="78" y="962" font-size="23" font-weight="700" style="fill:#3658b9">본인 fork → 코드·테스트·설명 PR → 검토</text>
<text x="78" y="995" class="note">experiments/본인GitHubID/ · 각자 PC 또는 Colab에서 개발</text>
<path d="M600 1028 V1059" fill="none" stroke="#3658b9" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#planned)"/>

<rect x="48" y="1076" width="1104" height="180" rx="20" fill="#f4f6fe" stroke="#6d83c2" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="88" cy="1116" r="21" fill="#3658b9"/>
<text x="88" y="1124" class="step">4</text>
<text x="124" y="1125" class="title">WaterMinCho가 같은 조건으로 비교합니다</text>
<rect x="986" y="1098" width="138" height="34" rx="17" fill="#e5ebff"/>
<text x="1055" y="1121" class="status" style="fill:#3658b9">비교 예정</text>
<text x="78" y="1177" class="body">같은 평가 자료로 세 모델과 기준 방법의 예측 오차 비교</text>
<text x="78" y="1220" font-size="22">저장한 모델 + 최신 풀이 이력 + 후보 문제 → 후보별 정답 확률</text>
<path d="M600 1270 V1301" fill="none" stroke="#3658b9" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#planned)"/>

<rect x="48" y="1318" width="1104" height="162" rx="20" fill="#f4f6fe" stroke="#6d83c2" stroke-width="2" stroke-dasharray="8 6"/>
<circle cx="88" cy="1358" r="21" fill="#3658b9"/>
<text x="88" y="1366" class="step">5</text>
<text x="124" y="1367" class="title">다음에 풀 문제를 학습 화면에 연결합니다</text>
<rect x="986" y="1340" width="138" height="34" rx="17" fill="#e5ebff"/>
<text x="1055" y="1363" class="status" style="fill:#3658b9">연결 예정</text>
<text x="78" y="1419" font-size="22">후보별 정답 확률 + 복습 시점·선수 개념·학습 목표 → 문제 선택</text>
<text x="78" y="1455" class="note">학습자는 PC 프로그램에서 추천된 문제를 풉니다.</text>
<text x="48" y="1524" class="note">현재 앱은 기존 규칙으로 문제를 고릅니다. 모델 학습·비교·추천 연결은 예정입니다.</text>
</svg>
