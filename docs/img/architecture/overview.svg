<title id="title">프로젝트 전체 구조</title>
<desc id="desc">문제와 학습 자료, PC 프로그램, 기기의 학습 기록을 연결합니다. API 서버가 풀이를 접수해 GitHub PR로 게시하고 추가 학습 기록은 비공개로 보관합니다. 공통 자료 이후 세 모델의 학습·비교와 앱 추천 연결은 예정입니다.</desc>
