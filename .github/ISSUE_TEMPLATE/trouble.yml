name: 사용이 불편하거나 오류가 납니다
description: 명령이 안 되거나, 설명이 헷갈리거나, 쓰기 불편한 점을 알려 주세요.
title: "[불편] "
labels: ["불편"]
body:
  - type: markdown
    attributes:
      value: 다른 내용은 [다른 문의 양식](https://github.com/WaterMinCho/programming-study/issues/new/choose)에서 작성하세요.
  - type: textarea
    id: what
    attributes:
      label: 무엇을 하려고 했나요
      placeholder: 예) start.bat 을 실행해서 프로그램을 열려고 했습니다
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: 실제로 어떻게 됐나요
      description: 어느 화면에서 무엇을 눌렀는지와 오류 문구를 적어 주세요. 공개 글이므로 계정 정보나 인증 코드, 답안 파일은 빼 주세요.
      render: text
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 환경
      description: 프로그램에서 열면 운영체제·버전·화면 설정을 자동으로 채웁니다. 내용을 확인하고 수정하거나 지워도 됩니다.
      placeholder: 예) Windows 11 / Python 3.12
      render: text
