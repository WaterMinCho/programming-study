name: 수집 서버 운영 검사

on:
  pull_request:
    paths:
      - "learning_server/**"
      - "aiprep/collection.py"
      - "aiprep/sharing.py"
      - "aiprep/privacy.py"
      - "aiprep/sync_schedule.py"
      - "submission_api.py"
      - "tests/test_submission_api.py"
      - "tests/test_learning_privacy.py"
      - "tests/test_private_submission.py"
      - "tests/test_learning_server.py"
      - "tests/test_learning_operations.py"
      - "tests/test_storage_capacity.py"
      - "tests/test_sync_schedule.py"
      - ".github/workflows/learning-server.yml"

permissions:
  contents: read

concurrency:
  group: learning-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operations:
    name: 운영 경로 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: "python -m pip install --only-binary=:all: -r learning_server/requirements.txt"
      - run: python -m unittest -v tests.test_learning_server tests.test_learning_operations tests.test_submission_api tests.test_learning_privacy tests.test_private_submission tests.test_storage_capacity tests.test_sync_schedule
