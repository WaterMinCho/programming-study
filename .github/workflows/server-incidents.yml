name: 수집 서버 장애 알림
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: rokey-server-incidents
  cancel-in-progress: false

jobs:
  relay:
    if: github.repository == 'WaterMinCho/programming-study' && github.ref == 'refs/heads/main' && vars.ROKEY_INCIDENT_RESOURCES != ''
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: tools
      - name: 새 장애와 복구 알림 보내기
        env:
          GH_TOKEN: ${{ github.token }}
          BETTER_STACK_INCIDENTS_READ_TOKEN: ${{ secrets.BETTER_STACK_INCIDENTS_READ_TOKEN }}
          SLACK_STUDY_WEBHOOK_URL: ${{ secrets.SLACK_STUDY_WEBHOOK_URL }}
          SLACK_STUDY_THREAD_ANCHOR: ${{ vars.SLACK_STUDY_THREAD_ANCHOR }}
          ROKEY_INCIDENT_RESOURCES: ${{ vars.ROKEY_INCIDENT_RESOURCES }}
        run: python3 -m tools.server_incident_alerts
