name: 스터디 알림 전달

on:
  pull_request:
    types: [opened, reopened, closed, ready_for_review]
  pull_request_review:
    types: [submitted]

# 포크의 코드와 비밀 값을 읽지 않고 이벤트 번호만 전달함
permissions: {}

jobs:
  relay:
    if: github.repository == 'WaterMinCho/programming-study'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 이벤트 번호 보관
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          data = {'pr': event['pull_request']['number'], 'action': event['action']}
          if event.get('review'):
              data['review'] = event['review']['id']
          Path('notification.json').write_text(json.dumps(data), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: study-notification
          path: notification.json
          retention-days: 1
          if-no-files-found: error
