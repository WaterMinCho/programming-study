name: PR 제목 검사

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 다시 검사할 PR 번호
        required: true
        type: string

permissions:
  contents: read
  statuses: write
  pull-requests: read

jobs:
  title:
    name: PR 제목 실행
    if: >-
      ${{ (github.event_name == 'pull_request_target' && !startsWith(github.event.pull_request.head.ref, 'study/')) ||
          (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/pr_title.py
          sparse-checkout-cone-mode: false
      - name: 제목 형식 확인
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 tools/pr_title.py --publish-status
      - name: 현재 PR 제목 수동 확인
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          number = os.environ["PR_NUMBER"]
          if not re.fullmatch(r"[1-9][0-9]*", number):
              raise SystemExit("PR 번호는 양의 정수로 입력해 주세요.")
          repository = os.environ["GITHUB_REPOSITORY"]
          response = subprocess.run(["gh", "api", f"repos/{repository}/pulls/{number}"],
                                    check=True, capture_output=True, text=True, timeout=20)
          pr = json.loads(response.stdout)
          base, head = pr.get("base", {}), pr.get("head", {})
          if pr.get("number") != int(number) or pr.get("state") != "open":
              raise SystemExit("입력한 번호의 열린 PR만 검사합니다.")
          if base.get("repo", {}).get("full_name") != repository or base.get("ref") != os.environ["DEFAULT_BRANCH"]:
              raise SystemExit("이 저장소의 기본 브랜치를 대상으로 하는 PR만 검사합니다.")
          branch = head.get("ref")
          if not isinstance(branch, str) or not branch or branch.startswith("study/"):
              raise SystemExit("study/ 풀이 브랜치는 수동 제목 검사 대상이 아닙니다.")
          sha, title = head.get("sha"), pr.get("title")
          if not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha) or not isinstance(title, str):
              raise SystemExit("PR의 현재 커밋과 제목을 확인하지 못했습니다.")
          env = os.environ.copy()
          env.update(PR_HEAD_SHA=sha, PR_TITLE=title)
          subprocess.run(["python3", "tools/pr_title.py", "--publish-status"], env=env, check=True)
          PY
