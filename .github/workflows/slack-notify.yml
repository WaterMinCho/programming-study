name: Slack 스터디 알림

on:
  workflow_run:
    workflows: [스터디 알림 전달, CI, 문장 검사, 수집 서버 운영 검사, 알고리즘 여행 검증, PR 제목 검사, Windows 첫 실행 검사]
    types: [completed]
  status:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

concurrency:
  group: study-final-notifications
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.repository == 'WaterMinCho/programming-study' &&
      (github.event_name != 'status' || github.event.context == '스터디 코드 검토')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # PR의 head·merge 코드 대신 보호된 기본 브랜치의 도구만 실행함
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            tools/slack_notify.py
            tools/slack_summary.py
            tools/study_checks.py
          sparse-checkout-cone-mode: false
      - name: 한국어 알림 보내기
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          SLACK_STUDY_WEBHOOK_URL: ${{ secrets.SLACK_STUDY_WEBHOOK_URL }}
        run: python3 -m tools.slack_summary
