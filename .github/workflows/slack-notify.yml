name: Slack 스터디 알림

on:
  workflow_run:
    workflows: [스터디 알림 전달, CI, 문장 검사, 수집 서버 운영 검사, 알고리즘 여행 검증]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  notify:
    if: >-
      github.repository == 'WaterMinCho/programming-study' &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && github.event.comment.user.type != 'Bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # PR의 head·merge 코드 대신 보호된 기본 브랜치의 도구만 실행함
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/slack_notify.py
          sparse-checkout-cone-mode: false
      - name: 한국어 알림 보내기
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_STUDY_WEBHOOK_URL: ${{ secrets.SLACK_STUDY_WEBHOOK_URL }}
        run: python3 tools/slack_notify.py
