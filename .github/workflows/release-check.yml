name: Windows 첫 실행 검사

on:
  workflow_dispatch:
  push:
    branches-ignore: ['main', 'study/**']
    paths:
      - 'tools/check_release.py'
      - '.github/workflows/release-check.yml'

permissions:
  contents: read

jobs:
  windows:
    name: 새 설치와 작은 창 (배율 ${{ matrix.scale }})
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.5']
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: ${{ matrix.scale }}
      STUDY_NODE_PROBE: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: 기존 화면 도구가 없는 새 환경 확인
        run: python -c "import importlib.util; assert importlib.util.find_spec('PyQt6') is None"
      - name: 프로그램 설치 경로와 첫 사용 검사
        run: python tools/check_release.py --out "${{ runner.temp }}/release-check"
      - name: 환경·창 크기·검사 결과와 화면 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-scale-${{ matrix.scale }}
          path: |
            ${{ runner.temp }}/release-check/report.json
            ${{ runner.temp }}/release-check/*.png
          if-no-files-found: warn
          retention-days: 14
