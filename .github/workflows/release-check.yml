name: Windows 첫 실행 검사

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/check_release.py'
      - 'tools/check_video_fullscreen.py'
      - '.github/workflows/release-check.yml'
      - 'bootstrap.py'
      - 'gitflow.py'
      - 'start.bat'
      - 'start.pyw'
      - 'gui/app.py'
      - 'gui/icon.py'
      - 'gui/launcher_shortcut.py'
      - 'gui/navigation.py'
      - 'gui/career_*.py'
      - 'gui/paper_explainer.py'
      - 'gui/video_viewer.py'
      - 'career/**'
      - 'tools/video_setup.py'
      - 'tests/test_gui_career*.py'
      - 'tests/test_gui_paper_explainer.py'
      - 'tests/test_gui_video_player.py'
      - 'gui/identity.py'
      - 'gui/dialogs.py'
      - 'gui/dialog_layout.py'
      - 'gui/privacy.py'
      - 'gui/auto_submission.py'
      - 'gui/submission_setup.py'
      - 'gui/ai_data.py'
      - 'gui/onboarding.py'
      - 'gui/team_dashboard.py'
      - 'gui/window.py'
      - 'gui/workspace.py'
      - 'gui/theme.py'
      - 'gui/settings_menu.py'
      - 'gui/ai_learn.py'
      - 'gui/ai_home.py'
      - 'gui/section_browser.py'
      - 'tests/test_gui_section_browser.py'
      - 'gui/hub_page.py'
      - 'gui/motion.py'
      - 'tests/test_gui_settings_menu.py'
      - 'tests/test_gui_local_identity_guard.py'
      - 'tests/test_gui_refresh.py'
      - 'learning_data/identity.py'
      - 'gui/ai_mock.py'
      - 'gui/kit.py'
      - 'tests/test_gui_ai_mock.py'
      - 'tests/test_gui_ai_courses.py'
      - 'tests/test_gui_navigation.py'
      - 'tests/test_gui_identity.py'
      - 'tests/test_gui_dialogs.py'
      - 'tests/test_gui_auto_submission.py'
      - 'tests/test_gui_submission.py'
      - 'tests/test_gui_onboarding.py'
      - 'tests/test_launcher_shortcut.py'
      - 'tests/test_gui_launcher.py'

permissions:
  contents: read

jobs:
  windows:
    name: 새 설치와 작은 창 (배율 ${{ matrix.scale }})
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.5']
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: ${{ matrix.scale }}
      STUDY_NODE_PROBE: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: 배율 검사에 필요한 화면 작업 영역 준비
        shell: powershell
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          $resolution = (Get-DisplayResolution | Out-String).Replace([string][char]0, '').Trim()
          Write-Output $resolution
          if ($resolution -notmatch '1920\s*x\s*1080') {
            throw "Failed to configure CI screen: $resolution"
          }
      - name: 기존 화면 도구가 없는 새 환경 확인
        run: python -c "import importlib.util; assert importlib.util.find_spec('PyQt6') is None"
      - name: 업데이트와 개인 기록 보존 검사
        run: >-
          python -m unittest -v
          tests.test_gitflow.GitFlowTest.test_learner_sync_updates_the_entire_project_without_touching_private_records
          tests.test_gitflow.GitFlowTest.test_failed_program_deletion_is_retried_without_deleting_private_records
          tests.test_gitflow.GitFlowTest.test_learner_case_only_rename_keeps_the_new_tracked_file
          tests.test_gitflow.GitFlowTest.test_windows_locked_program_deletion_recovers_after_unlock
      - name: main 갱신과 이전 설치의 풀이 보존 검사
        if: matrix.scale == '1'
        run: >-
          python -m unittest -v tests.test_gitflow_main_update
          tests.test_gitflow.GitFlowTest.test_windows_locked_program_change_keeps_answers_and_retries
      - name: 프로그램 설치 경로와 첫 사용 검사
        run: python tools/check_release.py --out "${{ runner.temp }}/release-check"
      - name: QHD 크기의 직무 화면 배치 검사
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          CAREER_EVIDENCE: ${{ runner.temp }}/release-check
        run: |
          # 러너 화면은 FHD까지 지원함. Windows 글꼴·배율로 QHD 크기를 렌더링해 배치를 확인함.
          & "${{ runner.temp }}/release-check/venv/Scripts/python.exe" -m unittest -v tests.test_gui_career.CareerGuiTest.test_tall_windows_keep_scene_labels_and_pictures_together
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 실제 재생기의 전체화면과 복원 검사
        shell: pwsh
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
          VIDEO_EVENT: ${{ github.event_name }}
          VIDEO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ($env:VIDEO_EVENT -eq 'pull_request') {
            if ($env:VIDEO_BASE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Invalid base SHA' }
            git fetch --no-tags --depth=1 origin "$env:VIDEO_BASE_SHA"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $changed = @(git diff --name-only "$env:VIDEO_BASE_SHA" HEAD --)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $targets = @('gui/video_viewer.py', 'career/player_html.py', 'tools/video_setup.py',
                         'gui/dialogs.py', 'gui/dialog_layout.py', 'gui/theme.py', 'gui/motion.py',
                         'tools/check_video_fullscreen.py', '.github/workflows/release-check.yml')
            if (-not ($changed | Where-Object { $_ -in $targets })) {
              Write-Output '영상 전체화면 관련 변경이 없어 추가 설치와 검사를 생략합니다.'
              exit 0
            }
          }
          & "${{ runner.temp }}/release-check/venv/Scripts/python.exe" tools/check_video_fullscreen.py --out "${{ runner.temp }}/release-check/video-fullscreen"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 환경·창 크기·검사 결과와 화면 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-scale-${{ matrix.scale }}
          path: |
            ${{ runner.temp }}/release-check/report.json
            ${{ runner.temp }}/release-check/career-tall-layout.json
            ${{ runner.temp }}/release-check/*.png
            ${{ runner.temp }}/release-check/video-fullscreen/*.json
            ${{ runner.temp }}/release-check/video-fullscreen/*.png
            ${{ runner.temp }}/release-check/video-fullscreen/*.html
            ${{ runner.temp }}/release-check/video-fullscreen/*.log
          if-no-files-found: warn
          retention-days: 14
