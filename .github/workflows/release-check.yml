name: Windows 첫 실행 검사

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/check_release.py'
      - '.github/workflows/release-check.yml'
      - 'bootstrap.py'
      - 'gitflow.py'
      - 'start.bat'
      - 'start.pyw'
      - 'gui/app.py'
      - 'gui/icon.py'
      - 'gui/launcher_shortcut.py'
      - 'gui/ai_mock.py'
      - 'gui/kit.py'
      - 'tests/test_gui_ai_mock.py'
      - 'tests/test_gui_ai_courses.py'
      - 'tests/test_launcher_shortcut.py'
      - 'tests/test_gui_launcher.py'

permissions:
  contents: read

jobs:
  windows:
    name: 새 설치와 작은 창 (배율 ${{ matrix.scale }})
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.5']
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: ${{ matrix.scale }}
      STUDY_NODE_PROBE: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: 기존 화면 도구가 없는 새 환경 확인
        run: python -c "import importlib.util; assert importlib.util.find_spec('PyQt6') is None"
      - name: 업데이트와 개인 기록 보존 검사
        run: >-
          python -m unittest -v
          tests.test_gitflow.GitFlowTest.test_learner_sync_updates_the_entire_project_without_touching_private_records
          tests.test_gitflow.GitFlowTest.test_failed_program_deletion_is_retried_without_deleting_private_records
          tests.test_gitflow.GitFlowTest.test_learner_case_only_rename_keeps_the_new_tracked_file
          tests.test_gitflow.GitFlowTest.test_windows_locked_program_deletion_recovers_after_unlock
      - name: 프로그램 설치 경로와 첫 사용 검사
        run: python tools/check_release.py --out "${{ runner.temp }}/release-check"
      - name: 환경·창 크기·검사 결과와 화면 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-scale-${{ matrix.scale }}
          path: |
            ${{ runner.temp }}/release-check/report.json
            ${{ runner.temp }}/release-check/*.png
          if-no-files-found: warn
          retention-days: 14
