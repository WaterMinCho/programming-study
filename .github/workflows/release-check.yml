name: Windows 첫 실행 검사

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: 전역 화면 확인 (배율 ${{ matrix.scale }})
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        scale: ['1', '1.5']
    env:
      PYTHONUTF8: '1'
      QT_QPA_PLATFORM: windows
      QT_SCALE_FACTOR: ${{ matrix.scale }}
      STUDY_NODE_PROBE: '0'
      STUDY_AUTO_SYNC: '0'
      STUDY_UI_ARTIFACT_DIR: ${{ runner.temp }}/global-ui-check
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install --only-binary=:all: PyQt6
      - name: 변경 화면과 전환 경로 확인
        run: python -c "import base64; exec(compile(base64.b64decode(''), 'native-windows-check.py', 'exec'))"
      - name: 실제 창과 위젯 화면 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-global-scale-${{ matrix.scale }}
          path: ${{ runner.temp }}/global-ui-check/
          if-no-files-found: error
          retention-days: 14
