name: CI

# public 저장소라 GitHub Actions 가 무료임
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: 변경 범위
    runs-on: ubuntu-latest
    outputs:
      bank: ${{ steps.scope.outputs.bank }}
      unit: ${{ steps.scope.outputs.unit }}
      gui: ${{ steps.scope.outputs.gui }}
      model: ${{ steps.scope.outputs.model }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 풀이 폴더 이름 검사
        run: |
          DUP=$(git ls-tree --name-only HEAD submissions/ | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$DUP" ]; then
            echo "::error::대소문자만 다른 풀이 폴더가 있습니다: $DUP"
            exit 1
          fi
      - name: 변경 파일 확인
        id: scope
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/ci_scope.py

  bank:
    name: 기능·자료 검사
    needs: scope
    if: needs.scope.outputs.bank == 'true' || needs.scope.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # 모든 모범 답안이 테스트를 통과하는지, 정답표가 실제 실행 결과와 맞는지 확인
      - if: needs.scope.outputs.bank == 'true'
        run: python tools/verify_bank.py
      # 알고리즘 여행의 평문 답 파일(dungeons/*/*/solution.py 등)이 올라오지 않았는지 봄. node 가 필요 없고 1초 안팎임
      - if: needs.scope.outputs.bank == 'true'
        run: python tools/journey_seal.py check
      # AI 비전 개론 은행: 평문 작업본, 문항 꼴·사실 확인·서명, 학습 노트 꼴·서명, 노트 말투·맥락을 봄. 모두 표준 라이브러리만 씀
      - if: needs.scope.outputs.bank == 'true'
        run: python tools/ai_seal.py check
      - if: needs.scope.outputs.bank == 'true'
        run: python tools/verify_ai.py --require-review
      - if: needs.scope.outputs.bank == 'true'
        run: python tools/verify_web.py --bank ai --total-mb 32 --require-review
      - if: needs.scope.outputs.bank == 'true'
        run: python tools/web_lint.py --bank ai --no-external
      # 세션 서비스·제출 흐름·실행기 테스트 (화면 테스트는 아래 별도 작업)
      # STUDY_LEAN_CI 가 있으면 자식 프로세스를 띄우고 시간을 기다리는 여정 테스트를 건너뜀. 그 테스트는 journey.yml 에서 돎
      - if: needs.scope.outputs.unit == 'true'
        run: python -m unittest discover -s tests
        env:
          STUDY_LEAN_CI: "1"

  model:
    name: 모델 제출 검사
    needs: scope
    if: needs.scope.outputs.model == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 바뀐 모델 파일의 구문 확인
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python -m tools.pr_checks model

  gui:
    name: 화면 테스트
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: needs.scope.outputs.gui == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # 화면 없이 PyQt6 동작을 검사함. 계획된 검사가 실패하면 필수 검사도 실패함
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-nanum
          python -m pip install -q --only-binary=:all: PyQt6
      - run: |
          python - <<'PY'
          import faulthandler
          import sys
          import unittest

          faulthandler.dump_traceback_later(480, repeat=True)
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_gui*.py", top_level_dir=".")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          faulthandler.cancel_dump_traceback_later()
          sys.exit(not result.wasSuccessful())
          PY
        env:
          QT_QPA_PLATFORM: offscreen

  required:
    name: 필수 검사
    needs: [scope, bank, gui, model]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 예정한 검사의 완료 확인
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json
          import os
          result = json.loads(os.environ['RESULTS'])
          assert result['scope']['result'] == 'success'
          outputs = result['scope']['outputs']
          planned = {'bank': any(outputs[name] == 'true' for name in ('bank', 'unit')),
                     'gui': outputs['gui'] == 'true', 'model': outputs['model'] == 'true'}
          for name, required in planned.items():
              expected = 'success' if required else 'skipped'
              assert result[name]['result'] == expected, (name, result[name]['result'], expected)
          print('변경 범위에 필요한 검사가 모두 끝났습니다.')
          PYCODE
