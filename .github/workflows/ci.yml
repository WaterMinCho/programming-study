name: CI

# public 저장소라 GitHub Actions 가 무료임
on:
  pull_request:
  push:
    branches: [main, 'study/**']   # study/<ID> = 프로그램의 [제출] 버튼이 올리는 브랜치

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bank:
    name: 문제 은행 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Windows·macOS 는 대소문자만 다른 폴더를 한 폴더로 열어서, 둘 다 main 에 들어가면 전원의 문제 받기가 막힘
      - name: 풀이 폴더 이름 검사
        run: |
          DUP=$(git ls-tree --name-only HEAD submissions/ | tr 'A-Z' 'a-z' | sort | uniq -d)
          if [ -n "$DUP" ]; then
            echo "::error::대소문자만 다른 풀이 폴더가 있습니다: $DUP"
            exit 1
          fi
      # 모든 모범 답안이 테스트를 통과하는지, 정답표가 실제 실행 결과와 맞는지 확인
      - run: python tools/verify_bank.py
      # 알고리즘 여행의 평문 답 파일(dungeons/*/*/solution.py 등)이 올라오지 않았는지 봄. node 가 필요 없고 1초 안팎임
      - run: python tools/journey_seal.py check
      # AI 비전 개론 은행: 평문 작업본, 문항 꼴·사실 확인·서명, 학습 노트 꼴·서명, 노트 말투·맥락을 봄. 모두 표준 라이브러리만 씀
      - run: python tools/ai_seal.py check
      - run: python tools/verify_ai.py --require-review
      - run: python tools/verify_web.py --bank ai --total-mb 32 --require-review
      - run: python tools/web_lint.py --bank ai --no-external
      # 세션 서비스·제출 흐름·실행기 테스트 (화면 테스트는 아래 별도 작업)
      # STUDY_LEAN_CI 가 있으면 자식 프로세스를 띄우고 시간을 기다리는 여정 테스트를 건너뜀. 그 테스트는 journey.yml 에서 돎
      - run: python -m unittest discover -s tests
        env:
          STUDY_LEAN_CI: "1"

  grade:
    name: 채점
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 채점 리포트
        run: python tools/ci_report.py
        env:
          STUDY_BASE_REF: ${{ startsWith(github.ref, 'refs/heads/study/') && 'main' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grading-report
          path: |
            report.md
            shortage.md
          if-no-files-found: warn
          retention-days: 7

  publish-report:
    name: 채점 결과 게시
    needs: grade
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          ref: main
      # [제출] 버튼이 study/<ID> 브랜치를 올리면 PR 을 대신 만들어 줌
      - name: PR 자동 생성
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/study/')
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          ID="${BRANCH#study/}"
          NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          if [ -z "$NUMBER" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$ID 풀이" \
              --body "프로그램의 [제출] 버튼으로 올린 풀이입니다. 채점·분석 결과는 아래 코멘트에 달립니다."
            NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --base main --state open --json number -q '.[0].number')
          fi
          echo "PR=$NUMBER" >> "$GITHUB_ENV"
          echo "STUDY_BASE_REF=main" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: grading-report
          path: reports
      - name: 댓글에 올릴 결과를 제한합니다
        if: always() && (github.event_name == 'pull_request' || env.PR != '')
        run: |
          python3 - <<'PYCODE'
          import html
          import os
          from pathlib import Path
          import re

          path = Path("reports/report.md")
          with path.open("rb") as source:
              text = source.read(20001).decode("utf-8", errors="replace")
          text = text[:20000]
          text = html.escape(text, quote=False).replace("\\", "\\\\")
          text = text.replace("[", "\\[").replace("]", "\\]").replace("@", "@\u200b")
          text = re.sub(r"(?i)https?://|www\.", lambda m: m[0][:1] + "\u200b" + m[0][1:], text)
          text = "".join(c for c in text if c in "\n\t" or ord(c) >= 32)
          text = text[:50000]
          run_id = os.environ["GITHUB_RUN_ID"]
          assert run_id.isdigit()
          url = "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + run_id
          result = "## 풀이 기록 기반 채점 결과\n\n제출 파일에서 계산한 결과입니다. [검사 실행](" + url + ")에서 처리 상태를 확인할 수 있습니다.\n\n" + text
          Path("reports/comment.md").write_text(result, encoding="utf-8")
          PYCODE
      # PR 에 점수·분석 코멘트를 남김. 포크에서 온 PR 은 권한이 없어 건너뜀
      - name: PR 코멘트
        if: always() && (github.event_name == 'pull_request' || env.PR != '')
        continue-on-error: true
        env:
          PR_EVENT: ${{ github.event.pull_request.number }}
        run: |
          NUMBER="${PR_EVENT:-$PR}"
          gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file reports/comment.md --edit-last --create-if-none \
            || gh pr comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file reports/comment.md
      - uses: actions/setup-python@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          python-version: "3.12"
      - name: 보관한 부족 문항 목록 가져오기
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -f reports/shortage.md ]; then cp reports/shortage.md shortage.md; fi
      # main 에 풀이가 올라오면 학습 현황판을 다시 만들어 dashboard 브랜치에 커밋함. README 가 이 브랜치의 이미지를 보여 줌
      - name: 현황판 갱신
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          python tools/dashboard.py --out out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin dashboard >/dev/null 2>&1; then
            git fetch -q origin dashboard
            git worktree add -q dash origin/dashboard
          else
            git worktree add -q --orphan dash
          fi
          cp out/dashboard.svg out/DASHBOARD.md dash/
          cd dash
          git add -A
          git commit -qm "학습 현황판 갱신" || { echo "바뀐 내용이 없어 커밋하지 않습니다."; exit 0; }
          git push -q origin HEAD:dashboard
      # main 푸시 때 문제 은행에 모자란 문항이 있으면 "출제 요청" 이슈를 만들거나 갱신함
      - name: 출제 요청 이슈
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('shortage.md') != ''
        continue-on-error: true
        run: |
          N=$(gh issue list --label "출제 요청" --state open --json number -q '.[0].number')
          if [ -n "$N" ]; then
            gh issue edit "$N" --body-file shortage.md
          else
            gh issue create --title "출제 요청: 문제 은행에 모자란 문항" --body-file shortage.md --label "출제 요청"
          fi

  gui:
    name: 화면 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: 화면 검사 범위
        id: scope
        run: python tools/ci_scope.py
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        if: steps.scope.outputs.gui == 'true'
        with:
          python-version: "3.13"
      # 화면 없이(offscreen) PyQt6 화면 테스트를 돌림. 필수 검사가 아니라서 환경 문제로 실패해도 머지를 막지 않음
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-nanum
          python -m pip install -q --only-binary=:all: PyQt6
        if: steps.scope.outputs.gui == 'true'
      - run: |
          python - <<'PY'
          import faulthandler
          import sys
          import unittest

          faulthandler.dump_traceback_later(480, repeat=True)
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_gui*.py", top_level_dir=".")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          faulthandler.cancel_dump_traceback_later()
          sys.exit(not result.wasSuccessful())
          PY
        if: steps.scope.outputs.gui == 'true'
        env:
          QT_QPA_PLATFORM: offscreen
