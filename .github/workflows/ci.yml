name: CI

# public 저장소에서는 GitHub Actions 가 무료입니다.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bank:
    name: 문제 은행 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # 모든 모범 답안이 테스트를 통과하는지, 정답표가 실제 실행 결과와 맞는지 확인
      - run: python tools/verify_bank.py

  grade:
    name: 채점
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # PR: 풀이가 바뀐 사람만 채점 / main: 전체 현황판. 결과는 실행 요약(Summary)에 남습니다.
      - name: 채점 리포트
        run: python tools/ci_report.py
      # PR 에 점수 코멘트를 남깁니다(포크에서 온 PR 은 권한이 없어 건너뜁니다).
      - name: PR 코멘트
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body-file report.md --edit-last --create-if-none \
            || gh pr comment "$PR" --body-file report.md
      # main 에 풀이가 올라오면 README 의 학습 현황판과 dashboard.svg 를 갱신해 커밋합니다.
      - name: 현황판 갱신
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          python tools/dashboard.py
          if git diff --quiet -- README.md dashboard.svg; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md dashboard.svg
          git commit -m "학습 현황판 갱신 [skip ci]"
          git pull --rebase origin main
          git push
      # 문제 은행에 모자란 문항이 있으면 "출제 요청" 이슈를 만들거나 갱신합니다(main 푸시 때).
      - name: 출제 요청 이슈
        if: github.event_name == 'push' && hashFiles('shortage.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh issue list --label "출제 요청" --state open --json number -q '.[0].number')
          if [ -n "$N" ]; then
            gh issue edit "$N" --body-file shortage.md
          else
            gh issue create --title "출제 요청: 문제 은행에 모자란 문항" --body-file shortage.md --label "출제 요청"
          fi
