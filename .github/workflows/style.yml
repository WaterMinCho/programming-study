name: 문장 검사

# 모델 설명은 코드 검토에서 읽고 공통 문서·지문·화면 문구의 문장만 자동 검사함.
# edited 를 넣어 마지막 push 뒤에 고친 PR 제목·본문도 스쿼시 머지 전에 다시 봄
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths-ignore:
      - "submissions/**"

concurrency:
  group: style-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  style:
    name: 문장 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 공통 파일의 문장 확인
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha }}
          SCOPE_HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: python -m tools.pr_checks style
