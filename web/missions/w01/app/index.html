<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상품 목록</title>
    <style>
      body { font-family: sans-serif; margin: 0; background: #f4f5f7; color: #1b1f24; }
      main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
      label { display: block; margin-bottom: 16px; color: #5b6470; font-size: 14px; }
      input { display: block; box-sizing: border-box; width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid #c9ced6; border-radius: 8px; font-size: 16px; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { display: flex; justify-content: space-between; gap: 12px; padding: 12px 8px; border-bottom: 1px solid #e3e6ea; background: #fff; }
      li span:last-child { font-variant-numeric: tabular-nums; }
      p { padding: 24px 8px; text-align: center; color: #5b6470; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
